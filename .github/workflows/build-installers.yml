name: Build offline installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: echo "ANDROID_HOME=$ANDROID_HOME" && sdkmanager --list >/dev/null || true
      - run: gradle assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: BSCH-Clinics-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build bundled offline server
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-offline.txt pyinstaller==5.13.2
          pyinstaller --clean --noconfirm desktop/windows7-ia32/bsch-server.spec
          New-Item -ItemType Directory -Force desktop/windows7-ia32/server | Out-Null
          Copy-Item dist/bsch-server.exe desktop/windows7-ia32/server/bsch-server.exe
      - uses: actions/setup-node@v4
        with: {node-version: '16'}
      - run: npm ci
        working-directory: desktop/windows7-ia32
      - run: npm run package:installer
        working-directory: desktop/windows7-ia32
      - uses: actions/upload-artifact@v4
        with:
          name: BSCH-Clinics-Windows7-32bit
          path: desktop/windows7-ia32/dist/*.exe
